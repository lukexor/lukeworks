[package]
name = "lukeworks"
version = "1.0.0"
rust-version = "1.91.1"
edition = "2024"
resolver = "3"
description = "A blog and project portfolio by Lucas Petherbridge on programming, technology, and video games."
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
large_futures = "warn"
missing_const_for_fn = "warn"
print_literal = "warn"

[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_compatibility = "warn"
rust_2018_idioms = "warn"
rust_2021_compatibility = "warn"
rust_2024_compatibility = "warn"
unused = "warn"

[features]
hydrate = ["dep:console_error_panic_hook", "leptos/hydrate"]
ssr = [
  "dep:axum",
  "dep:axum-extra",
  "dep:leptos_axum",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]

# Markdown is rendered to HTML at build time, so comrak and the frontmatter
# parser are build-only — none of this ships in either the server binary or the
# WASM bundle.
[build-dependencies]
comrak = { version = "0.54", default-features = false, features = [
  # `syntect-fancy` uses the pure-Rust regex engine, avoiding an oniguruma C
  # dependency in the build graph.
  "syntect-fancy",
] }
gray_matter = { version = "0.3", default-features = false, features = ["yaml"] }
serde = { version = "1", features = ["derive"] }
# NOTE: `content/redirects.toml` is parsed by hand in build.rs rather than with
# the `toml` crate. Adding `toml` here pulled `serde_core` into the build-script
# graph, and cargo reused that host artifact when linking the cdylib, which mold
# then rejected: "R_X86_64_PC32 relocation ... can not be used; recompile with
# -fPIC". The redirect file is a fixed shape we own, so a ~30 line reader is
# cheaper than fighting that.

[dependencies]
# global dependencies
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
  "wasmbind",
] }
leptos = { version = "0.8", features = ["rustls"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
# Already in the graph via leptos_router, which percent-decodes query values on
# the way back in. Encoding a category with the same scheme keeps the round trip
# honest.
percent-encoding = "2"
# Server function arguments and return types cross the network boundary as JSON.
serde = { version = "1", features = ["derive"] }
web-sys = { version = "0.3", features = [
  "Document",
  "HtmlDocument",
  "Window",
] }
# Not optional: `hydrate()` is the wasm_bindgen entrypoint, and `ThemeToggle`
# needs `JsCast` in both builds, including `ssr` where the browser code is
# never reached. web-sys pulls it in regardless.
# Pinned exactly — the wasm-bindgen CLI cargo-leptos runs must match the crate
# version. Bump both together.
wasm-bindgen = "=0.2.126"

# `hydrate` dependencies
console_error_panic_hook = { version = "0.1", optional = true }

# `ssr` dependencies
axum = { version = "0.8", optional = true }
axum-extra = { version = "0.12", features = ["cookie"], optional = true }
leptos_axum = { version = "0.8", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tower = { version = "0.5", features = ["limit"], optional = true }
# Held at 0.6 deliberately: leptos_axum still depends on tower-http 0.6, and
# bumping to 0.7 only duplicates the crate in the graph. Nothing we use changed.
tower-http = { version = "0.6", features = [
  "compression-gzip",
  "cors",
  "fs",
  "trace",
], optional = true }
tracing = { version = "0.1", features = [
  "release_max_level_info",
  "log",
], optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }

[profile.dev]
# Disabling debug info greatly speeds up compile times
# See: https://kobzol.github.io/rust/rustc/2025/05/20/disable-debuginfo-to-improve-rust-compile-times.html
#
# `debug = false` saves both compile time and WASM download times when hot-reloading.
# When you specifically need to track down a line for debugging, change to
# "limited" or comment it out entirely
debug = false
# A higher opt-level can speed up overall incremental compile times and give a
# performance boost
opt-level = 1

# A higher opt-level can speed up overall incremental compile times and give a
# performance boost
[profile.dev.package."*"]
opt-level = 3
[profile.dev.build-override]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"      # similar to true, but substantially faster
# See: https://smallcultfollowing.com/babysteps/blog/2024/05/02/unwind-considered-harmful/
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
# See: https://github.com/leptos-rs/cargo-leptos/issues/441
strip = false

[package.metadata.leptos]
site-root = "target/site"
style-file = "style/main.css"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
