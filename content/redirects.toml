# Permanent (308) redirects carried over from the Next.js site.
#
# Source: `git show d82ff04^:web/next.config.js`
#
# Compiled into a static table by `build.rs` — see `src/redirects.rs`. Editing
# this file is enough; there is no second list to keep in sync.
#
# ORDER IS SIGNIFICANT. Rules are tried top-to-bottom and the first match wins,
# so the three specific `/articles/<date>/<slug>` rules must precede the generic
# `/articles/:year/:month/:title` rule or the old TetaNES URLs land on the wrong
# page.
#
# `:param` segments match exactly one path segment. A `:name` in `to` is
# substituted with whatever `from` captured under that name.
#
# ## Rules dropped during Phase 4
#
# The old site was a single page with `#about`/`#blog`/`#projects`/`#contact`
# anchors, and four rules pointed at those fragments. This site serves /about,
# /blog and /projects as real pages, so keeping those rules verbatim would have
# 301'd the new pages away and made them unreachable:
#
#   /about    -> /#about      dropped; /about is a page
#   /projects -> /#projects   dropped; /projects is a page
#   /articles -> /#blog       retargeted to /blog, below
#   /contact  -> /#contact    retargeted below at /about#contact
#
# Two more were inherited dead weight: `/articles/category/:category` and
# `/:section/tag/:tag` pointed at `/category/*` and `/tag/*`, which were never
# implemented on the Next.js site either — they 404'd then and would now.

# Specific article rules — must precede the generic /articles rule below.
[[redirect]]
from = "/articles/2019/09/rustynes_part_1"
to = "/tetanes-part-1"

[[redirect]]
from = "/articles/2020/01/rustynes_part_2"
to = "/tetanes-part-2"

[[redirect]]
from = "/projects/2019/08/rustynes"
to = "/tetanes"

[[redirect]]
from = "/articles/:year/:month/:title"
to = "/:title"

# Was `/#blog` on the old single-page site.
[[redirect]]
from = "/articles"
to = "/blog"

# Was `/#contact`. Contact is a section of the about page rather than a route
# of its own, so the fragment survives the move.
[[redirect]]
from = "/contact"
to = "/about#contact"

# NOTE: /rss is not built yet (still Phase 4 work), so this currently redirects
# to a 404. Kept rather than dropped because the destination is decided and the
# rule carries real subscriber traffic — it starts working the moment /rss lands.
[[redirect]]
from = "/feed"
to = "/rss"
